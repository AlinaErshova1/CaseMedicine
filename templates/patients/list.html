{% extends 'base.html' %}
{% block title %}Пациенты — AI-MRI{% endblock %}

{% block content %}
<header class="page-header">
  <h1 class="page-title">Пациенты</h1>
  <p class="page-subtitle">Выберите пациента для просмотра исследований и результатов анализа.</p>
</header>

<div class="search">
  <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>
  <input class="input" type="search" id="searchInput" placeholder="Поиск по фамилии, ID пациента">
</div>

<nav class="alpha-filter" id="alphaFilter">
  <span class="alpha-filter__item alpha-filter__item--active" data-letter="all">Все</span>
  <span class="alpha-filter__item" data-letter="А">А</span>
  <span class="alpha-filter__item" data-letter="Б">Б</span>
  <span class="alpha-filter__item" data-letter="В">В</span>
  <span class="alpha-filter__item" data-letter="Г">Г</span>
  <span class="alpha-filter__item" data-letter="Д">Д</span>
  <span class="alpha-filter__item" data-letter="Е">Е</span>
  <span class="alpha-filter__item" data-letter="Ж">Ж</span>
  <span class="alpha-filter__item" data-letter="З">З</span>
  <span class="alpha-filter__item" data-letter="И">И</span>
  <span class="alpha-filter__item" data-letter="К">К</span>
  <span class="alpha-filter__item" data-letter="Л">Л</span>
  <span class="alpha-filter__item" data-letter="М">М</span>
  <span class="alpha-filter__item" data-letter="Н">Н</span>
  <span class="alpha-filter__item" data-letter="О">О</span>
  <span class="alpha-filter__item" data-letter="П">П</span>
  <span class="alpha-filter__item" data-letter="Р">Р</span>
  <span class="alpha-filter__item" data-letter="С">С</span>
  <span class="alpha-filter__item" data-letter="Т">Т</span>
  <span class="alpha-filter__item" data-letter="У">У</span>
  <span class="alpha-filter__item" data-letter="Ф">Ф</span>
  <span class="alpha-filter__item" data-letter="Х">Х</span>
  <span class="alpha-filter__item" data-letter="Ц">Ц</span>
  <span class="alpha-filter__item" data-letter="Ч">Ч</span>
  <span class="alpha-filter__item" data-letter="Ш">Ш</span>
  <span class="alpha-filter__item" data-letter="Щ">Щ</span>
  <span class="alpha-filter__item" data-letter="Э">Э</span>
  <span class="alpha-filter__item" data-letter="Ю">Ю</span>
  <span class="alpha-filter__item" data-letter="Я">Я</span>
</nav>

<h2 style="font-size:15px;font-weight:600;margin-bottom:14px;">Все пациенты</h2>

<section class="patient-list" id="patientList">
  <p class="text-secondary">Загрузка…</p>
</section>

<script>
  const API_URL = "http://localhost:8000";
  const token = localStorage.getItem("token");
  const listRole = localStorage.getItem("role") || "doctor";
  if (!token) window.location.href = "/login/";

  let allPatients = [];
  let activeLetter = "all";
  let searchQuery = "";

  function statusBadge(prediction) {
    if (!prediction) return '<span class="badge badge--neutral">Нет данных</span>';
    if (prediction === "no_tumor") return '<span class="badge badge--success">Норма</span>';
    if (prediction === "glioma" || prediction === "meningioma" || prediction === "pituitary")
      return '<span class="badge badge--warning">Обнаружено</span>';
    return '<span class="badge badge--neutral">—</span>';
  }

  function applyFilters() {
    let filtered = allPatients;

    if (activeLetter !== "all") {
      filtered = filtered.filter(p => {
        const name = (p.full_name || "").trim();
        if (!name) return false;
        return name[0].toUpperCase() === activeLetter;
      });
    }

    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(p =>
        (p.full_name || "").toLowerCase().includes(q) ||
        (p.anonymized_code || "").toLowerCase().includes(q)
      );
    }

    renderPatients(filtered);
  }

  function renderPatients(patients) {
    const listEl = document.getElementById("patientList");
    if (!patients.length) {
      listEl.innerHTML = '<p class="text-secondary">Нет пациентов</p>';
      return;
    }
    listEl.innerHTML = patients.map(p => `
      <a href="/patients/${p.id}/" class="patient-row">
        <div class="patient-row__avatar">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        </div>
        <div class="patient-row__info">
          <div class="patient-row__name">${p.full_name}</div>
          <div class="patient-row__meta">${p.anonymized_code} · ${p.age ?? "—"} лет</div>
        </div>
        ${statusBadge(p.last_prediction)}
        <span class="icon patient-row__arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
      </a>
    `).join("");
  }

  async function loadPatients() {
    const endpoint = listRole === "admin"
      ? `${API_URL}/admin/patients`
      : `${API_URL}/patients`;

    try {
      const res = await fetch(endpoint, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.status === 401) {
        localStorage.clear();
        window.location.href = "/login/";
        return;
      }
      if (!res.ok) throw new Error(`Ошибка ${res.status}`);
      allPatients = await res.json();
      applyFilters();
    } catch (err) {
      document.getElementById("patientList").innerHTML =
        `<p class="text-secondary">Ошибка: ${err.message}</p>`;
    }
  }

  document.querySelectorAll("#alphaFilter .alpha-filter__item").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll("#alphaFilter .alpha-filter__item").forEach(x =>
        x.classList.remove("alpha-filter__item--active"));
      el.classList.add("alpha-filter__item--active");
      activeLetter = el.dataset.letter;
      applyFilters();
    });
  });

  document.getElementById("searchInput").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    applyFilters();
  });

  loadPatients();
</script>
{% endblock %}
