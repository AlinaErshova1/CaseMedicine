  <div class="sidebar__logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4a5 5 0 0 0-5 5v1a4 4 0 0 0 0 8h1v-2h6v2h1a4 4 0 0 0 0-8V9a5 5 0 0 0-5-5z"/>
        <circle cx="9" cy="11" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="11" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="15" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <span class="logo-text">AI-MRI</span>
  </div>

  <nav class="nav">
    <a href="/patients/" class="nav__item" data-role="doctor">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
      Пациенты
    </a>
    <a href="/admin-panel/doctors/" class="nav__item" data-role="admin">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      Врачи
    </a>
    <a href="/admin-panel/patients/" class="nav__item" data-role="admin">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
      Все пациенты
    </a>
    <a href="#" class="nav__item" data-role="doctor">
      <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg></span>
      Настройки
    </a>
  </nav>

  <div class="sidebar__user">
    <div class="user-avatar">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    </div>
    <div class="user-info">
      <div class="user-info__name" id="userName">Пользователь</div>
      <div class="user-info__role" id="userRole">—</div>
    </div>
    <a href="#" class="btn-logout" id="logoutBtn" title="Выйти">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
    </a>
  </div>
</aside>

<script>
  // === 1. Имя и роль текущего пользователя ===
  const role = localStorage.getItem("role") || "doctor";
  const userName = localStorage.getItem("userName") || "Пользователь";

  const nameEl = document.getElementById("userName");
  if (nameEl) nameEl.textContent = userName;

  const roleEl = document.getElementById("userRole");
  if (roleEl) {
    roleEl.textContent = role === "admin" ? "Администратор" : "Врач";
  }

  // === 2. Скрываем пункты меню, недоступные текущей роли ===
  document.querySelectorAll("[data-role]").forEach(el => {
    if (el.dataset.role !== role) el.style.display = "none";
  });

  // === 3. Кнопка "Выйти" ===
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", function (e) {
      e.preventDefault();
      localStorage.clear();
      window.location.href = "/login/";
    });
  }
</script>
